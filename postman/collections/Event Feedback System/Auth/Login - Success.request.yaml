$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
body:
  type: json
  content: |-
    {
        "email": "{{registeredEmail}}",
        "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 200', () => pm.response.to.have.status(200));
      pm.test('returns a token', () => pm.expect(pm.response.json().token).to.be.a('string'));
      pm.test('returns the role', () => pm.expect(pm.response.json().role).to.eql('attendee'));
    language: text/javascript
order: 3808
