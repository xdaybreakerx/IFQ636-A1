$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
body:
  type: json
  content: '{ "email": "{{registeredEmail}}", "password": "wrongpassword1" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 401', () => pm.response.to.have.status(401));
      pm.test('invalid credentials message', () => pm.expect(pm.response.json().message).to.eql('Invalid email or password'));
    language: text/javascript
order: 4808
