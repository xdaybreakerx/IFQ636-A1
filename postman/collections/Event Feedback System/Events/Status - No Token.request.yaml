$kind: http-request
url: "{{baseUrl}}/api/events/{{status_event_id}}}}/status"
method: PATCH
body:
  type: json
  content: |-
    {
        "status": "open"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('status is 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 8000
