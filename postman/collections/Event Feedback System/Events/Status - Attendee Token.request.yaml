$kind: http-request
url: "{{baseUrl}}/api/events/{{status_event_id}}/status"
method: PATCH
body:
  type: json
  content: |-
    {
        "status": "open"
    }
auth:
  type: bearer
  credentials:
    token: "{{attendee_token}}"
scripts:
  - type: afterResponse
    code: pm.test('status is 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 8985
