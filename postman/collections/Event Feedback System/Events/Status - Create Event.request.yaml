$kind: http-request
url: "{{baseUrl}}/api/events"
method: POST
body:
  type: json
  content: |-
    {
        "title": "Status Test Event",
        "startDate": "2026-11-20T08:00:00.000Z",
        "endDate": "2026-11-20T10:00:00.000Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('status_event_id', pm.response.json()._id);
    language: text/javascript
order: 7000
