$kind: http-request
url: '{{baseUrl}}/api/feedback/mine'
method: GET
auth:
    type: bearer
    credentials:
        token: '{{attendee_token}}'
scripts:
    - type: afterResponse
      code: |-
          const list = pm.response.json();
          pm.test('status is 200', () => pm.response.to.have.status(200));
          pm.test('AC7 - includes the feedback just submitted', () =>
              pm.expect(list.map((f) => f.event._id)).to.include(pm.collectionVariables.get('fb_open_id')));
      language: text/javascript
order: 6000
