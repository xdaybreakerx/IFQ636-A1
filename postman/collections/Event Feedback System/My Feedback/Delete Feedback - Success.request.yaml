$kind: http-request
url: '{{baseUrl}}/api/feedback/{{fb_id}}'
method: DELETE
auth:
    type: bearer
    credentials:
        token: '{{attendee_token}}'
scripts:
    - type: afterResponse
      code: pm.test('AC3 - status is 200', () => pm.response.to.have.status(200));
      language: text/javascript
order: 3000
