$kind: http-request
url: '{{baseUrl}}/api/events/{{fb_open_id}}/results'
method: GET
auth:
    type: bearer
    credentials:
        token: '{{organiser_token}}'
scripts:
    - type: afterResponse
      code: |-
          const results = pm.response.json();
          // back to Sam 4 + Tom 2
          pm.test('AC7 - count and average reflect the delete', () => {
              pm.expect(results.count).to.equal(2);
              pm.expect(results.average).to.equal(3);
          });
      language: text/javascript
order: 3100
